<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AISUBS — AI Subtitle Translator & Sync</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="blob-bg blob-1"></div>
  <div class="blob-bg blob-2"></div>

  <main class="container">
    <header class="header">
      <div class="badge">v1.2.0 • Ultra Fast & Sync</div>
      <h1>AISUBS</h1>
      <p class="subtitle">AI-powered on-demand subtitle translation and audio sync for Stremio & Nuvio.</p>
    </header>

    <div class="glass-card">
      <form id="configForm">
        <!-- Target Language -->
        <div class="form-group">
          <label for="langSelect">Target Language</label>
          <div class="select-wrapper">
            <select id="langSelect">
              <option value="spa|Spanish|🇪🇸">🇪🇸 Spanish (Español)</option>
              <option value="fre|French|🇫🇷">🇫🇷 French (Français)</option>
              <option value="ger|German|🇩🇪">🇩🇪 German (Deutsch)</option>
              <option value="ita|Italian|🇮🇹">🇮🇹 Italian (Italiano)</option>
              <option value="por|Portuguese|🇧🇷">🇧🇷 Portuguese (Português)</option>
              <option value="rus|Russian|🇷🇺">🇷🇺 Russian (Русский)</option>
              <option value="ara|Arabic|🇸🇦">🇸🇦 Arabic (العربية)</option>
              <option value="nld|Dutch|🇳🇱">🇳🇱 Dutch (Nederlands)</option>
              <option value="tur|Turkish|🇹🇷">🇹🇷 Turkish (Türkçe)</option>
              <option value="pol|Polish|🇵🇱">🇵🇱 Polish (Polski)</option>
              <option value="jpn|Japanese|🇯🇵">🇯🇵 Japanese (日本語)</option>
              <option value="kor|Korean|🇰🇷">🇰🇷 Korean (한국어)</option>
              <option value="chi|Chinese|🇨🇳">🇨🇳 Chinese (中文)</option>
              <option value="hin|Hindi|🇮🇳">🇮🇳 Hindi (हिन्दी)</option>
              <option value="swe|Swedish|🇸🇪">🇸🇪 Swedish (Svenska)</option>
              <option value="ell|Greek|🇬🇷">🇬🇷 Greek (Ελληνικά)</option>
              <option value="ukr|Ukrainian|🇺🇦">🇺🇦 Ukrainian (Українська)</option>
              <option value="ind|Indonesian|🇮🇩">🇮🇩 Indonesian (Bahasa Indonesia)</option>
            </select>
          </div>
        </div>

        <!-- AI Provider -->
        <div class="form-group">
          <label for="providerSelect">Translation Engine</label>
          <div class="select-wrapper">
            <select id="providerSelect">
              <option value="free">⚡ Free Web Engine (No API Key Required)</option>
              <option value="gemini">✨ Google Gemini (Recommended - Free & Fast)</option>
              <option value="groq">⚡ Groq (Ultra-Fast Llama 3.3)</option>
              <option value="openrouter">🌐 OpenRouter (Claude, DeepSeek, etc.)</option>
              <option value="openai">🤖 OpenAI (GPT-4o mini)</option>
              <option value="deepseek">🧠 DeepSeek API</option>
            </select>
          </div>
        </div>

        <!-- API Key & Model (Conditional) -->
        <div id="aiCredentials" class="hidden-field">
          <div class="form-group">
            <label for="apiKey">API Key</label>
            <input type="password" id="apiKey" placeholder="Paste your API key here">
          </div>

          <div class="form-group">
            <label for="modelInput">Model Name (Optional)</label>
            <input type="text" id="modelInput" placeholder="default (e.g. gemini-2.0-flash)">
          </div>
        </div>

        <!-- Sync Offset & Bilingual -->
        <div class="grid-2">
          <div class="form-group">
            <label for="offsetMs">Sync Offset (ms)</label>
            <input type="number" id="offsetMs" value="0" step="100" placeholder="0">
            <span class="helper">Negative = earlier, Positive = delay</span>
          </div>

          <div class="form-group checkbox-group">
            <label class="custom-switch">
              <input type="checkbox" id="bilingual">
              <span class="slider"></span>
            </label>
            <div class="switch-meta">
              <span class="switch-title">Dual Subtitles</span>
              <span class="helper">Shows original + translated lines</span>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="actions">
          <button type="button" id="installBtn" class="btn btn-primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Install in Stremio
          </button>
          
          <button type="button" id="copyBtn" class="btn btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy Addon URL (Nuvio)
          </button>

          <button type="button" id="qrBtn" class="btn btn-icon" title="Scan QR Code for Android / TV">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </button>
        </div>

        <div id="statusToast" class="toast hidden"></div>
      </form>
    </div>

    <!-- QR Code Modal -->
    <div id="qrModal" class="modal hidden">
      <div class="modal-card">
        <h3>Scan with Nuvio or Phone</h3>
        <p class="helper">Scan with your TV app camera or phone to install.</p>
        <div id="qrCodeContainer"></div>
        <button id="closeModalBtn" class="btn btn-secondary" style="margin-top: 1rem;">Close</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    const providerSelect = document.getElementById('providerSelect');
    const aiCredentials = document.getElementById('aiCredentials');
    const langSelect = document.getElementById('langSelect');
    const apiKey = document.getElementById('apiKey');
    const modelInput = document.getElementById('modelInput');
    const offsetMs = document.getElementById('offsetMs');
    const bilingual = document.getElementById('bilingual');
    const installBtn = document.getElementById('installBtn');
    const copyBtn = document.getElementById('copyBtn');
    const qrBtn = document.getElementById('qrBtn');
    const qrModal = document.getElementById('qrModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const statusToast = document.getElementById('statusToast');

    function toggleCredentials() {
      if (providerSelect.value === 'free') {
        aiCredentials.classList.add('hidden-field');
      } else {
        aiCredentials.classList.remove('hidden-field');
      }
    }
    providerSelect.addEventListener('change', toggleCredentials);
    toggleCredentials();

    function buildManifestUrl() {
      const [langCode, langName] = langSelect.value.split('|');
      const config = {
        lang: langCode,
        langName: langName,
        provider: providerSelect.value,
        apiKey: apiKey.value.trim(),
        model: modelInput.value.trim() || 'default',
        offsetMs: parseInt(offsetMs.value, 10) || 0,
        bilingual: bilingual.checked
      };

      const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(config))))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');

      const origin = window.location.origin;
      return `${origin}/${b64}/manifest.json`;
    }

    function showToast(msg) {
      statusToast.textContent = msg;
      statusToast.classList.remove('hidden');
      setTimeout(() => statusToast.classList.add('hidden'), 3500);
    }

    installBtn.addEventListener('click', () => {
      const manifestUrl = buildManifestUrl();
      const stremioProtocol = manifestUrl.replace(/^https?:\/\//, 'stremio://');
      window.location.href = stremioProtocol;
    });

    copyBtn.addEventListener('click', async () => {
      const manifestUrl = buildManifestUrl();
      try {
        await navigator.clipboard.writeText(manifestUrl);
        showToast('✓ Addon URL copied! Paste into Nuvio or Stremio.');
      } catch {
        prompt('Copy your addon URL:', manifestUrl);
      }
    });

    qrBtn.addEventListener('click', () => {
      const manifestUrl = buildManifestUrl();
      const container = document.getElementById('qrCodeContainer');
      container.innerHTML = '';
      new QRCode(container, {
        text: manifestUrl,
        width: 190,
        height: 190,
        colorDark: "#ffffff",
        colorLight: "#0f131d",
        correctLevel: QRCode.CorrectLevel.M
      });
      qrModal.classList.remove('hidden');
    });

    closeModalBtn.addEventListener('click', () => qrModal.classList.add('hidden'));
    qrModal.addEventListener('click', (e) => {
      if (e.target === qrModal) qrModal.classList.add('hidden');
    });
  </script>
</body>
</html>
